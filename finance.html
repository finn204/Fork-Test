<!DOCTYPE html>
<html lang="en">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<script src="/api/config"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Finances</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="sync.js"></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --bg: #0A0A0B;
  --bg-deep: #050506;
  --bg-card: rgba(255, 255, 255, 0.04);
  --bg-secondary: rgba(255, 255, 255, 0.035);
  --glass-bg: rgba(255, 255, 255, 0.04);
  --glass-border: transparent;
  --glass-border-strong: transparent;
  --glass-shadow:
    0 1px 0 0 rgba(255, 255, 255, 0.06) inset,
    0 12px 40px rgba(0, 0, 0, 0.45),
    0 1px 2px rgba(0, 0, 0, 0.25);
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --text-quaternary: #4D4B47;
  --border: transparent;
  --border-soft: transparent;
  --accent: #E07658;
  --success: #6BE3A4;
  --warning: #F2C063;
  --danger: #FF6B6B;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  min-height: 100%;
}

/* Backdrop — black with subtle warm + cool washes */
body::before {
  content: '';
  position: fixed;
  inset: -10%;
  z-index: -2;
  background:
    radial-gradient(60% 45% at 82% 14%, rgba(224, 118, 88, 0.16) 0%, transparent 55%),
    radial-gradient(55% 45% at 18% 90%, rgba(180, 180, 200, 0.06) 0%, transparent 55%),
    linear-gradient(180deg, #0A0A0B 0%, #050506 100%);
  filter: blur(40px) saturate(1.05);
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  opacity: 0.7;
  pointer-events: none;
}

.shell {
  max-width: 880px;
  margin: 0 auto;
  padding: 24px 16px 100px;   /* extra bottom padding so tab bar doesn't cover content */
}

/* ===== Back to dashboard ===== */
.fin-back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px 8px 10px;
  margin: 0 0 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 999px;
  color: var(--text-secondary);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s ease, color 0.15s ease;
}
.fin-back-btn:hover, .fin-back-btn:active {
  background: rgba(255,255,255,0.07);
  color: var(--text-primary);
}
.fin-back-btn svg { display: block; }


/* Sections: hide non-active when bottom tabs are in use */
.section[hidden] { display: none !important; }

/* Hide scrollbars everywhere */
html, body { scrollbar-width: none; -ms-overflow-style: none; }
*::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }

/* Section title with reorder controls */
.section { margin-bottom: 18px; }
.section-title {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-title::before {
  content: '';
  width: 18px;
  height: 1px;
  background: var(--text-tertiary);
  opacity: 0.6;
}
.section-title-text { display: inline-flex; align-items: center; gap: 8px; }
.section-title-text::before {
  content: '⚡';
  font-size: 14px;
  color: var(--text-tertiary);
  opacity: 0.5;
}
.section-reorder { display: inline-flex; gap: 6px; opacity: 0.5; }
.section-reorder button {
  background: transparent;
  border: none;
  color: var(--text-tertiary);
  cursor: pointer;
  font-size: 12px;
  padding: 0 4px;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}
.section-reorder button:hover { color: var(--text-primary); }
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(255,255,255,0.08), transparent);
}

/* Card */
.card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  margin-bottom: 10px;
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: var(--glass-shadow);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 14px; right: 14px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent);
  pointer-events: none;
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
}

/* Tag pills */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  padding: 3px 9px 3px 8px;
  border-radius: 999px;
  margin: 2px;
  font-weight: 700;
  letter-spacing: 0.04em;
  border: none;
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-secondary);
  font-family: var(--font-mono);
  text-transform: uppercase;
}
.tag::before {
  content: '';
  width: 5px; height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
  background: rgba(255,255,255,0.30);
}
.tag-green::before { background: #6BE3A4; box-shadow: 0 0 6px rgba(107,227,164,0.55); }
.tag-green { background: rgba(107, 227, 164, 0.10); color: #8EE9B7; }
.pill-group { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }

/* Empty state */
.empty-state {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  text-align: center;
  padding: 16px 0;
  font-family: var(--font-mono);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.empty-state::before {
  content: '';
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--text-quaternary);
  flex-shrink: 0;
}

/* Quick-add composer */
.quick-add {
  display: flex;
  gap: 6px;
  align-items: stretch;
  margin-top: 10px;
  padding: 4px;
  background: rgba(0, 0, 0, 0.30);
  border-radius: 12px;
  border: none;
}
.quick-add input,
.quick-add input[type="text"],
.quick-add input[type="number"],
.quick-add input[type="date"],
.quick-add select {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  padding: 9px 12px;
  font-family: inherit;
  font-size: 14px;
}
.quick-add input::placeholder { color: var(--text-tertiary); }
.quick-add-btn {
  padding: 0 14px;
  background: rgba(255,255,255,0.06);
  border: none;
  color: var(--text-secondary);
  border-radius: 9px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.quick-add-btn:hover { background: rgba(255,255,255,0.12); color: var(--text-primary); }
.quick-add-btn:active { transform: scale(0.96); }

/* Custom list rows */
.custom-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  background: rgba(255,255,255,0.025);
  border: none;
  border-radius: 10px;
  margin-bottom: 5px;
  font-size: 13px;
  color: var(--text-primary);
}
.custom-item:hover { background: rgba(255,255,255,0.05); }
.custom-item .item-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.30);
  flex-shrink: 0;
}
.custom-item span { flex: 1; word-break: break-word; }
.custom-item .delete-x {
  background: transparent;
  border: none;
  color: var(--text-tertiary);
  cursor: pointer;
  font-size: 16px;
  padding: 2px 6px;
  border-radius: 6px;
  opacity: 0.5;
}
.custom-item:hover .delete-x { opacity: 1; }
.custom-item .delete-x:hover { color: #FF8A8A; background: rgba(255,138,138,0.10); }

/* Inline label eyebrow */
.label {
  font-size: 9.5px;
  color: var(--text-tertiary);
  margin-bottom: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  font-family: var(--font-mono);
}

/* ===== Net Worth ===== */

/* Stock-style net-worth chart */
.nw-chart-wrap {
  margin: 14px 0 18px;
  padding: 14px 16px 12px;
  background: rgba(255, 255, 255, 0.025);
  border: none;
  border-radius: 12px;
  position: relative;
  overflow: hidden;
}
.nw-chart-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-family: var(--font-mono);
}
.nw-chart-label { color: var(--text-tertiary); }
.nw-chart-delta { font-variant-numeric: tabular-nums; color: var(--text-tertiary); }
.nw-chart-delta.up   { color: #6BE3A4; }
.nw-chart-delta.down { color: #FF8A8A; }
.nw-chart-svg {
  display: block;
  width: 100%;
  height: 200px;
  color: var(--text-tertiary);
  overflow: visible;
  transition: color 0.4s ease;
}
.nw-chart-grid {
  stroke: rgba(255,255,255,0.05);
  stroke-width: 1;
  stroke-dasharray: 2 4;
  vector-effect: non-scaling-stroke;
}
.nw-chart-empty {
  position: absolute;
  inset: 28px 16px 12px;
  font-size: 11px;
  color: var(--text-tertiary);
  text-align: center;
  font-style: italic;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.nw-chart-wrap.has-data .nw-chart-empty { display: none; }

/* Stats overlay sitting at the bottom of the chart card */
.nw-chart-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,0.05);
}
@media (max-width: 720px) {
  .nw-chart-stats { grid-template-columns: repeat(2, 1fr); }
}
.nw-stat {
  display: flex; flex-direction: column; gap: 2px;
  padding: 4px 6px;
}
.nw-stat-label {
  font-size: 9px; letter-spacing: 0.16em; font-weight: 800;
  text-transform: uppercase; color: var(--text-tertiary);
  font-family: var(--font-mono);
}
.nw-stat-val {
  font-size: 13px; font-weight: 700;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
  font-family: var(--font-mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Two-column overview row: line chart + donut */
.nw-overview-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 12px;
  margin: 14px 0 18px;
  align-items: stretch;
}
@media (max-width: 720px) {
  .nw-overview-grid { grid-template-columns: 1fr; }
}
.nw-overview-grid .nw-chart-wrap { margin: 0; }
.nw-donut-wrap {
  position: relative;
  padding: 14px 16px 12px;
  background: rgba(255, 255, 255, 0.025);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
}
.nw-donut-stage {
  position: relative;
  width: 140px;
  height: 140px;
  margin: 4px auto 6px;
}
.nw-donut-svg {
  width: 140px; height: 140px;
  transform: rotate(-90deg);
  display: block;
}
.nw-donut-svg path {
  transition: opacity 0.18s, filter 0.25s;
}
/* Soft fade glow on the WHOLE donut, not per-path — much subtler, no outline */
.nw-donut-stage::after {
  content: '';
  position: absolute;
  inset: 18px;
  border-radius: 50%;
  background: radial-gradient(circle at center,
    rgba(110,231,183,0.18) 0%,
    rgba(110,231,183,0.08) 40%,
    transparent 70%);
  filter: blur(10px);
  pointer-events: none;
  z-index: -1;
}
.nw-donut-svg:hover path { opacity: 0.5; }
.nw-donut-svg path:hover { opacity: 1; }
.nw-donut-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none;
  text-align: center;
}
.nw-donut-num {
  font-size: 16px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.015em;
  color: var(--text-primary);
  line-height: 1;
}
.nw-donut-sub {
  font-size: 9px; letter-spacing: 0.18em; font-weight: 700;
  text-transform: uppercase; color: var(--text-tertiary);
  margin-top: 4px;
}
.nw-donut-empty {
  text-align: center;
  font-size: 11px; color: var(--text-tertiary);
  padding: 8px 0;
  font-style: italic;
}
.nw-donut-empty.hidden { display: none; }
.nw-donut-legend {
  margin-top: 8px;
  display: flex; flex-direction: column; gap: 4px;
}
.nw-leg {
  display: grid; grid-template-columns: 8px 1fr auto;
  gap: 8px; align-items: center;
  font-size: 11px;
  padding: 4px 6px;
  border-radius: 6px;
  font-variant-numeric: tabular-nums;
}
.nw-leg-dot {
  width: 8px; height: 8px; border-radius: 50%;
  box-shadow: 0 0 6px currentColor;
}
.nw-leg-name { color: var(--text-secondary); }
.nw-leg-pct {
  color: var(--text-primary); font-weight: 700;
  font-family: var(--font-mono);
  font-size: 10.5px;
}

/* ===== Activity log ===== */
.nw-activity {
  margin-top: 14px;
  padding: 14px 16px 12px;
  background: rgba(255, 255, 255, 0.025);
  border-radius: 12px;
}
.nw-activity-h {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-family: var(--font-mono);
}
.nw-activity-list {
  display: flex; flex-direction: column; gap: 6px;
  /* Show ~3 rows then scroll. Each row is ~44px + 6px gap. */
  max-height: 156px;
  overflow-y: auto;
  scrollbar-width: thin;
}
/* Subtle scroll affordance — shows there's more below */
.nw-activity-list::-webkit-scrollbar { width: 4px !important; display: block !important; }
.nw-activity-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 2px; }
.nw-activity-list::-webkit-scrollbar-track { background: transparent; }
.nw-activity-row {
  display: grid; grid-template-columns: 4px 1fr auto auto;
  gap: 10px; align-items: center;
  padding: 8px 12px;
  background: rgba(255,255,255,0.025);
  border-radius: 8px;
  font-size: 12.5px;
  transition: background 0.15s;
}
.nw-activity-row:hover { background: rgba(255,255,255,0.05); }
.nw-activity-bar {
  width: 4px; height: 24px; border-radius: 2px;
  flex-shrink: 0;
  box-shadow: 0 0 6px currentColor;
}
.nw-activity-info {
  min-width: 0;
  display: flex; flex-direction: column; gap: 1px;
}
.nw-activity-name {
  color: var(--text-primary); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-size: 13px;
}
.nw-activity-meta {
  font-size: 10.5px; color: var(--text-tertiary);
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.nw-activity-amt {
  font-size: 13px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  font-family: var(--font-mono);
  white-space: nowrap;
}
.nw-activity-amt.up   { color: #6BE3A4; }
.nw-activity-amt.down { color: #FF8A8A; }
.nw-activity-date {
  font-size: 10.5px; color: var(--text-tertiary);
  font-family: var(--font-mono);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.nw-activity-empty {
  text-align: center; padding: 12px 0;
  color: var(--text-tertiary); font-size: 11px;
  font-style: italic;
}
.nw-activity-empty.hidden { display: none; }
.nw-activity-list.hidden { display: none; }








</style>
</head>
<body>
<div class="shell">

<!-- ===== BACK BUTTON ===== -->
<a href="index.html" class="fin-back-btn" aria-label="Back to dashboard">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
  <span>Back</span>
</a>

<!-- ===== SPENDING ===== -->
<div class="section" data-section="spend">
  <div class="section-title">
    <span class="section-title-text">SPENDING</span>
  </div>
  <div class="card" style="background:transparent;border:none !important;box-shadow:none;padding:0;overflow:visible">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:14px">
      <div>
        <div style="font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.04em;font-weight:500">Spent this month</div>
        <div id="spendMonthTotal" style="font-size:34px;font-weight:700;color:var(--text-primary);line-height:1.05;margin-top:2px">$0</div>
        <div id="spendMonthNote" style="font-size:11px;color:var(--text-tertiary);margin-top:4px"></div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <select id="spendMonthSelect" style="background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;font-family:inherit;cursor:pointer"></select>
      </div>
    </div>

    <div class="nw-donut-wrap" id="budgetCard" style="max-width:100%;margin-bottom:14px;display:none">
      <div class="nw-chart-head">
        <span class="nw-chart-label" id="budgetCatLabel">Bars &amp; Nightlife budget</span>
        <span class="nw-chart-delta" id="budgetEdit" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted">edit</span>
      </div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px">
        <span id="budgetSpent" style="font-size:20px;font-weight:700;color:var(--text-primary)">$0</span>
        <span id="budgetOf" style="font-size:12px;color:var(--text-tertiary)">of $0 this month</span>
      </div>
      <div style="height:10px;border-radius:999px;background:rgba(255,255,255,0.06);overflow:hidden">
        <div id="budgetBar" style="height:100%;border-radius:999px;width:0%;transition:width 0.4s ease,background 0.3s ease"></div>
      </div>
      <div id="budgetMsg" style="font-size:11px;color:var(--text-tertiary);margin-top:8px"></div>
      <div id="budgetEditRow" style="display:none;margin-top:12px;gap:8px;align-items:center">
        <input id="budgetInput" type="number" step="10" style="width:110px;background:var(--bg-input);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13px">
        <button id="budgetSave" style="padding:8px 16px;border-radius:8px;border:none;background:linear-gradient(180deg,#FFF,#E8E5DD);color:#0A0A0B;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer">Save</button>
      </div>
    </div>

    <div class="nw-overview-grid">
      <div class="nw-donut-wrap" style="grid-column:1/-1;max-width:100%">
        <div class="nw-chart-head">
          <span class="nw-chart-label">By category</span>
          <span class="nw-chart-delta" id="spendCatCount">—</span>
        </div>
        <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center">
          <div class="nw-donut-stage" style="flex-shrink:0">
            <svg class="nw-donut-svg" id="spendDonutSvg" viewBox="0 0 140 140" aria-hidden="true"></svg>
            <div class="nw-donut-center">
              <div class="nw-donut-num" id="spendDonutTotal">—</div>
              <div class="nw-donut-sub">total</div>
            </div>
          </div>
          <div class="nw-donut-legend" id="spendDonutLegend" style="flex:1;min-width:200px;margin-top:0"></div>
        </div>
        <div class="nw-donut-empty" id="spendDonutEmpty">No spending recorded for this month</div>
      </div>
    </div>

    <div class="nw-activity" id="spendActivity" style="margin-top:0">
      <div class="nw-activity-h">
        <span class="nw-chart-label">Transactions</span>
        <span class="nw-chart-delta" id="spendActivityCount">—</span>
      </div>
      <div class="nw-activity-list" id="spendActivityList" style="max-height:340px"></div>
      <div class="nw-activity-empty" id="spendActivityEmpty">No transactions this month.</div>
    </div>
  </div>
</div>

</div>


<script>
(function () {
  function storeGet(key) {
    try { const raw = localStorage.getItem(key); return raw == null ? null : JSON.parse(raw); }
    catch (e) { return null; }
  }
  function fmtMoney(n) {
    return '$' + (Math.round(n * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  }
  const PALETTE = {
    'Bars & Nightlife': '#F2C063',
    'Food & Takeout': '#6EE7B7',
    'Transport & Fuel': '#7DD3FC',
    'Travel & Trips': '#B794F4',
    'Cash Withdrawal': '#94A3B8',
    'Fitness & Sport': '#6BE3A4',
    'Groceries': '#A3E635',
    'Gambling': '#FF8A8A',
    'Health': '#F472B6',
    'Grooming': '#FDBA74',
    'Shopping & Retail': '#60A5FA',
    'Other': '#76746E',
    'Family & Friends': '#8B8680'
  };
  function colorFor(cat) { return PALETTE[cat] || '#8B8680'; }

  function monthLabel(ym) {
    const [y, m] = ym.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString(undefined, { month: 'long', year: 'numeric', timeZone: 'UTC' });
  }

  function renderSpend() {
    const txns = storeGet('spend_txns') || [];
    const sel = document.getElementById('spendMonthSelect');
    if (!sel) return; // section not on this page

    const months = [...new Set(txns.map(t => t.date.slice(0, 7)))].sort().reverse();
    const prevVal = sel.value;
    sel.innerHTML = months.map(m => `<option value="${m}">${monthLabel(m)}</option>`).join('');
    const activeMonth = months.includes(prevVal) ? prevVal : (months[0] || '');
    sel.value = activeMonth;

    const monthTxns = txns.filter(t => t.date.slice(0, 7) === activeMonth)
                           .sort((a, b) => b.date.localeCompare(a.date));
    const total = monthTxns.reduce((s, t) => s + t.amount, 0);

    document.getElementById('spendMonthTotal').textContent = months.length ? fmtMoney(total) : '$0';
    document.getElementById('spendMonthNote').textContent = months.length
      ? `${monthTxns.length} transactions — family/friend transfers and salary excluded`
      : 'No spending data yet.';

    // ---- donut ----
    const byCat = {};
    for (const t of monthTxns) byCat[t.category] = (byCat[t.category] || 0) + t.amount;
    const catEntries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

    const svg = document.getElementById('spendDonutSvg');
    const legend = document.getElementById('spendDonutLegend');
    const empty = document.getElementById('spendDonutEmpty');
    const donutTotalEl = document.getElementById('spendDonutTotal');
    const catCountEl = document.getElementById('spendCatCount');

    donutTotalEl.textContent = catEntries.length ? fmtMoney(total) : '—';
    catCountEl.textContent = catEntries.length ? catEntries.length + ' categories' : '—';

    if (!catEntries.length) {
      svg.innerHTML = '';
      legend.innerHTML = '';
      empty.style.display = 'flex';
    } else {
      empty.style.display = 'none';
      const r = 54, cx = 70, cy = 70, circ = 2 * Math.PI * r;
      let offset = 0;
      let paths = '';
      for (const [cat, amt] of catEntries) {
        const frac = amt / total;
        const dash = Math.max(frac * circ - 1.5, 0.5);
        const gap = circ - dash;
        paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colorFor(cat)}" stroke-width="16" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"><title>${cat}: ${fmtMoney(amt)}</title></circle>`;
        offset += frac * circ;
      }
      svg.innerHTML = paths;
      legend.innerHTML = catEntries.map(([cat, amt]) => {
        const pct = Math.round((amt / total) * 100);
        return `<div class="nw-leg"><span class="nw-leg-dot" style="background:${colorFor(cat)};color:${colorFor(cat)}"></span><span class="nw-leg-name">${cat}</span><span class="nw-leg-pct">${fmtMoney(amt)} · ${pct}%</span></div>`;
      }).join('');
    }

    // ---- activity feed ----
    const list = document.getElementById('spendActivityList');
    const listEmpty = document.getElementById('spendActivityEmpty');
    const countEl = document.getElementById('spendActivityCount');
    countEl.textContent = monthTxns.length ? monthTxns.length + ' txns' : '—';
    if (!monthTxns.length) {
      list.innerHTML = '';
      listEmpty.style.display = 'block';
    } else {
      listEmpty.style.display = 'none';
      list.innerHTML = monthTxns.map(t => {
        const d = new Date(t.date + 'T00:00:00Z');
        const dateStr = d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', timeZone: 'UTC' });
        return `<div class="nw-activity-row">
          <div class="nw-activity-bar" style="background:${colorFor(t.category)};color:${colorFor(t.category)}"></div>
          <div class="nw-activity-info">
            <div class="nw-activity-name">${t.name}</div>
            <div class="nw-activity-meta">${t.category}</div>
          </div>
          <div class="nw-activity-amt down">-${fmtMoney(t.amount)}</div>
          <div class="nw-activity-date">${dateStr}</div>
        </div>`;
      }).join('');
    }
  }

  // ---- monthly category budget (currently just Bars & Nightlife, the
  // category that turned out to be ~47% of spend) ----
  const BUDGET_KEY = 'spend_budgets';
  const BUDGET_CAT = 'Bars & Nightlife';
  const DEFAULT_BUDGET = 800;

  function getBudgets() { return storeGet(BUDGET_KEY) || {}; }
  function setBudget(cat, amt) {
    const b = getBudgets();
    b[cat] = amt;
    localStorage.setItem(BUDGET_KEY, JSON.stringify(b));
  }

  function renderBudget() {
    const card = document.getElementById('budgetCard');
    if (!card) return;
    const txns = storeGet('spend_txns') || [];
    if (!txns.length) { card.style.display = 'none'; return; }
    card.style.display = '';

    const sel = document.getElementById('spendMonthSelect');
    const activeMonth = sel && sel.value;
    const budgets = getBudgets();
    const budget = budgets[BUDGET_CAT] != null ? budgets[BUDGET_CAT] : DEFAULT_BUDGET;

    const spent = txns
      .filter(t => t.date.slice(0, 7) === activeMonth && t.category === BUDGET_CAT)
      .reduce((s, t) => s + t.amount, 0);
    const pct = budget > 0 ? Math.min(150, Math.round((spent / budget) * 100)) : 0;

    document.getElementById('budgetSpent').textContent = fmtMoney(spent);
    document.getElementById('budgetOf').textContent = 'of ' + fmtMoney(budget) + ' this month';
    document.getElementById('budgetInput').value = budget;

    const bar = document.getElementById('budgetBar');
    bar.style.width = Math.min(100, pct) + '%';
    const msg = document.getElementById('budgetMsg');
    if (spent >= budget) {
      bar.style.background = '#FF6B6B';
      msg.textContent = 'Over budget by ' + fmtMoney(spent - budget) + '.';
    } else if (pct >= 80) {
      bar.style.background = '#F2C063';
      msg.textContent = fmtMoney(budget - spent) + ' left — getting close.';
    } else {
      bar.style.background = '#6BE3A4';
      msg.textContent = fmtMoney(budget - spent) + ' left this month.';
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    renderSpend();
    renderBudget();
    const sel = document.getElementById('spendMonthSelect');
    if (sel) sel.addEventListener('change', function () { renderSpend(); renderBudget(); });

    const editLink = document.getElementById('budgetEdit');
    const editRow = document.getElementById('budgetEditRow');
    if (editLink) editLink.addEventListener('click', function () {
      editRow.style.display = editRow.style.display === 'none' ? 'flex' : 'none';
    });
    const saveBtn = document.getElementById('budgetSave');
    if (saveBtn) saveBtn.addEventListener('click', function () {
      const v = Number(document.getElementById('budgetInput').value);
      if (!isNaN(v) && v >= 0) setBudget(BUDGET_CAT, v);
      editRow.style.display = 'none';
      renderBudget();
    });
  });
  window.addEventListener('storage', function () { renderSpend(); renderBudget(); });
})();
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  if (typeof initCloudSync !== 'function') return;
  initCloudSync({
    appKey: 'finance',
    syncedKeys: ['spend_txns', 'spend_budgets'],
    onApplied: function () {
      window.dispatchEvent(new Event('storage'));
    }
  });
});
</script>

</body>
</html>
