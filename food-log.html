<!DOCTYPE html>
<html lang="en">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Food · Dashboard</title>

<script src="/api/config"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="sync.js"></script>
<script src="topbar.js" defer></script>

<style>
:root {
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --success: #6BE3A4;
  --warning: #F2C063;
  --danger:  #FF6B6B;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #050506;
  color: var(--text-secondary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(224, 118, 88, 0.16), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(180, 180, 200, 0.06), transparent 50%);
  filter: blur(40px);
  pointer-events: none;
  z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none;
  z-index: -1;
}
@keyframes drift {
  0%   { transform: translate3d(0,0,0); }
  100% { transform: translate3d(-22px, 14px, 0); }
}

.page { max-width: 1100px; margin: 0 auto; }

.dash-title {
  margin: 0 0 14px;
  font-size: 28px; font-weight: 700;
  letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
@media (max-width: 480px) { .dash-title { font-size: 22px; } }

.section { margin-top: 8px; }
.section-title {
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary);
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px;
}
.section-title::before {
  content: ''; width: 18px; height: 1px;
  background: var(--text-tertiary); opacity: 0.6;
}
.section-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(255,255,255,0.08), transparent);
}

.gm-card {
  position: relative;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 14px;
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  overflow: hidden;
}

.gm-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  flex-wrap: wrap; gap: 12px; margin-bottom: 14px;
}
.gm-header-left { display: flex; flex-direction: column; }
.gm-eyebrow {
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary); margin-bottom: 6px;
}
.gm-progress-row { display: flex; align-items: baseline; gap: 6px; }
.gm-progress-num {
  font-size: 42px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.045em; color: var(--text-primary); line-height: 1;
}
.gm-progress-label {
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.10em; text-transform: uppercase;
  color: var(--text-tertiary); margin-left: 4px;
}
.gm-streak {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 12px; border-radius: 999px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  color: var(--text-tertiary);
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.10em; text-transform: uppercase;
}

.goal-list { list-style: none; margin: 0; padding: 0; }
.empty-state {
  text-align: center; font-size: 12px; font-style: italic;
  color: var(--text-tertiary); padding: 14px 0;
}
.gm-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; margin-bottom: 6px;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  transition: background 0.2s;
}
.gm-row:hover { background: rgba(255,255,255,0.06); }
.gm-row-emoji { font-size: 18px; flex-shrink: 0; }
.gm-row-body { flex: 1; min-width: 0; }
.gm-row-name {
  font-size: 14px; color: var(--text-primary);
  outline: none; border-radius: 4px; padding: 2px 4px; margin: -2px -4px;
}
.gm-row-name[contenteditable="true"] {
  outline: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.28);
}
.gm-row-meta {
  font-size: 11px; color: var(--text-tertiary); margin-top: 2px;
}
.goal-delete {
  border: 0; background: transparent; color: var(--text-tertiary);
  font-size: 18px; cursor: pointer; padding: 0 4px;
  opacity: 0.5; transition: opacity 0.2s, color 0.2s;
  flex-shrink: 0;
}
.gm-row:hover .goal-delete { opacity: 1; }
.goal-delete:hover { color: var(--danger); }

/* One-tap repeats. Finn eats the same handful of meals on rotation,
   so the fastest possible log is a button, not a text field. */
.quick-row {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 14px;
}
.quick-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 13px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 999px;
  background: rgba(255,255,255,0.04);
  color: var(--text-secondary);
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer;
  transition: background 0.13s, color 0.13s, border-color 0.13s, transform 0.13s;
}
.quick-chip::before { content: '+'; color: var(--text-tertiary); font-weight: 700; }
.quick-chip:hover {
  background: rgba(107,227,164,0.12);
  border-color: rgba(107,227,164,0.4);
  color: var(--text-primary);
}
.quick-chip:active { transform: scale(0.96); }
.quick-chip.just-added {
  background: rgba(107,227,164,0.22);
  border-color: var(--success);
  color: var(--success);
}
.quick-chip.just-added::before { content: '\2713'; color: var(--success); }
.quick-label {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--text-tertiary);
  margin-bottom: 10px;
}

.gm-input-wrap {
  margin-bottom: 18px;
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.gm-input {
  flex: 1; min-width: 160px;
  padding: 11px 14px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; background: rgba(0,0,0,0.28);
  color: var(--text-primary);
  font-family: inherit; font-size: 14px; outline: none;
  transition: border-color 0.2s, background 0.2s;
}
.gm-input::placeholder { color: var(--text-tertiary); }
.gm-input:focus { border-color: rgba(255,255,255,0.28); background: rgba(0,0,0,0.36); }

.gm-add {
  padding: 11px 20px; border: 0; border-radius: 12px;
  background: linear-gradient(180deg, #FFFFFF 0%, #E8E5DD 100%);
  color: #0A0A0B; font-family: inherit; font-size: 13px; font-weight: 700;
  cursor: pointer;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.9),
    0 2px 8px rgba(0,0,0,0.35),
    0 8px 22px rgba(0,0,0,0.25);
  transition: transform 0.1s, filter 0.15s;
}
.gm-add:hover { filter: brightness(1.06); transform: translateY(-1px); }
.gm-add:active { transform: translateY(0); }

@media (max-width: 480px) {
  body { padding: max(20px, env(safe-area-inset-top)) 14px 50px; }
  .gm-card { padding: 16px; }
  .gm-progress-num { font-size: 36px; }
}
</style>
</head>
<body>
<div class="page">

  <h1 class="dash-title">Food</h1>

  <div class="section">
    <div class="section-title">Today</div>
    <div class="gm-card">
      <div class="gm-header">
        <div class="gm-header-left">
          <div class="gm-eyebrow">Logged Today</div>
          <div class="gm-progress-row">
            <span class="gm-progress-num" id="todayCount">0</span>
            <span class="gm-progress-label">meals / items</span>
          </div>
        </div>
        <span class="gm-streak" id="lastEaten">Nothing logged yet</span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Log</div>
    <div class="gm-card">
      <div class="quick-label">Usuals — one tap</div>
      <div class="quick-row" id="quickRow"></div>

      <div class="gm-input-wrap">
        <input class="gm-input" id="itemInput" type="text"
               placeholder="Something else?" autocomplete="off">
        <input class="gm-input" id="noteInput" type="text"
               placeholder="Note (optional)" autocomplete="off" style="max-width:160px;">
        <button class="gm-add" id="itemAdd" type="button">Add</button>
      </div>

      <ul class="goal-list" id="itemList"></ul>
    </div>
  </div>

</div><!-- /.page -->

<script>
(function () {
  'use strict';

  const STORE_KEY = 'food:logs';

  const listEl   = document.getElementById('itemList');
  const quickEl  = document.getElementById('quickRow');
  const inputEl  = document.getElementById('itemInput');
  const noteEl   = document.getElementById('noteInput');
  const addEl    = document.getElementById('itemAdd');
  const countEl  = document.getElementById('todayCount');
  const lastEl   = document.getElementById('lastEaten');

  function load() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
    catch (e) { return []; }
  }
  function save(items) {
    localStorage.setItem(STORE_KEY, JSON.stringify(items));
  }
  function todayKey(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fmtTime(ts) {
    return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  function fmtDate(ts) {
    return new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  function render() {
    renderQuick();
    const items = load().slice().sort(function (a, b) { return b.ts - a.ts; });
    listEl.innerHTML = '';

    const today = todayKey(Date.now());
    const todays = items.filter(function (i) { return todayKey(i.ts) === today; });
    countEl.textContent = todays.length;
    lastEl.textContent = items.length ? ('Last: ' + items[0].n + ' · ' + fmtTime(items[0].ts)) : 'Nothing logged yet';

    if (items.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty-state';
      li.textContent = 'Nothing logged yet — add what you ate or drank below.';
      listEl.appendChild(li);
      return;
    }

    items.forEach(function (item) {
      const li = document.createElement('li');
      li.className = 'gm-row';

      const emoji = document.createElement('span');
      emoji.className = 'gm-row-emoji';
      emoji.textContent = '🍽️';

      const body = document.createElement('div');
      body.className = 'gm-row-body';

      const name = document.createElement('div');
      name.className = 'gm-row-name';
      name.textContent = item.n;
      name.contentEditable = 'true';
      name.addEventListener('blur', function () {
        const list = load();
        const target = list.find(function (x) { return x.id === item.id; });
        if (target) { target.n = name.textContent.trim(); save(list); }
      });
      name.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); name.blur(); }
      });

      const meta = document.createElement('div');
      meta.className = 'gm-row-meta';
      meta.textContent = fmtDate(item.ts) + ' · ' + fmtTime(item.ts) + (item.note ? ' · ' + item.note : '');

      body.append(name, meta);

      const del = document.createElement('button');
      del.className = 'goal-delete';
      del.type = 'button';
      del.textContent = '×';
      del.addEventListener('click', function () {
        const list = load().filter(function (x) { return x.id !== item.id; });
        save(list); render();
      });

      li.append(emoji, body, del);
      listEl.appendChild(li);
    });
  }

  function logItem(text, note) {
    if (!text) return;
    const list = load();
    list.push({
      id: 'f' + Date.now() + Math.floor(Math.random() * 1000),
      n: text,
      note: note || '',
      ts: Date.now()
    });
    save(list);
    render();
  }

  function add() {
    const text = inputEl.value.trim();
    if (!text) return;
    logItem(text, noteEl.value.trim());
    inputEl.value = '';
    noteEl.value = '';
  }

  /* ===== Usuals =====
     Learned from what he actually logs rather than a fixed menu:
     the most-repeated names win, ties broken by whichever was eaten
     most recently. Seeds only fill the gaps until there's history. */
  const SEEDS = ['Venison + rice', 'Chicken + rice', 'Eggs', 'Protein shake', 'Coffee', 'Steak + veg'];
  const QUICK_MAX = 8;

  function usuals() {
    const stats = new Map();
    load().forEach(function (i) {
      const name = (i.n || '').trim();
      if (!name) return;
      const key = name.toLowerCase();
      const cur = stats.get(key) || { name: name, count: 0, last: 0 };
      cur.count += 1;
      if (i.ts > cur.last) { cur.last = i.ts; cur.name = name; }
      stats.set(key, cur);
    });
    const ranked = Array.from(stats.values())
      .sort(function (a, b) { return (b.count - a.count) || (b.last - a.last); })
      .map(function (x) { return x.name; });

    const seen = new Set(ranked.map(function (n) { return n.toLowerCase(); }));
    SEEDS.forEach(function (s) {
      if (ranked.length < QUICK_MAX && !seen.has(s.toLowerCase())) { ranked.push(s); seen.add(s.toLowerCase()); }
    });
    return ranked.slice(0, QUICK_MAX);
  }

  function renderQuick() {
    quickEl.innerHTML = '';
    usuals().forEach(function (name) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'quick-chip';
      b.textContent = name;
      b.addEventListener('click', function () {
        logItem(name, '');
        /* render() rebuilds this row, so flag the fresh button by name. */
        const fresh = Array.prototype.find.call(quickEl.children, function (el) {
          return el.textContent === name;
        });
        if (fresh) {
          fresh.classList.add('just-added');
          setTimeout(function () { fresh.classList.remove('just-added'); }, 1100);
        }
      });
      quickEl.appendChild(b);
    });
  }
  addEl.addEventListener('click', add);
  inputEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); });
  noteEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); });

  render();

  if (window.initCloudSync) {
    window.initCloudSync({
      appKey: 'food',
      syncedKeys: [STORE_KEY],
      onApplied: render
    });
  }
})();
</script>

</body>
</html>
