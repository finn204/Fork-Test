<!DOCTYPE html>
<html lang="en">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<script src="lock.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Business · Dashboard</title>

<script src="/api/config"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="topbar.js" defer></script>

<style>
:root {
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --success: #6BE3A4;
  --warning: #F2C063;
  --danger:  #FF6B6B;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #050506;
  color: var(--text-secondary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(88, 166, 224, 0.16), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(180, 180, 200, 0.06), transparent 50%);
  filter: blur(40px);
  pointer-events: none;
  z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none;
  z-index: -1;
}
@keyframes drift {
  0%   { transform: translate3d(0,0,0); }
  100% { transform: translate3d(-22px, 14px, 0); }
}

.page { max-width: 1100px; margin: 0 auto; }

.dash-title {
  margin: 0 0 4px;
  font-size: 28px; font-weight: 700;
  letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.dash-sub {
  font-size: 12px; color: var(--text-tertiary); margin: 0 0 14px;
}
@media (max-width: 480px) { .dash-title { font-size: 22px; } }

.section { margin-top: 8px; }
.section-title {
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary);
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px;
}
.section-title::before {
  content: ''; width: 18px; height: 1px;
  background: var(--text-tertiary); opacity: 0.6;
}
.section-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(255,255,255,0.08), transparent);
}

.gm-card {
  position: relative;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 14px;
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  overflow: hidden;
}

.gm-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  flex-wrap: wrap; gap: 12px; margin-bottom: 14px;
}
.gm-header-left { display: flex; flex-direction: column; }
.gm-eyebrow {
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary); margin-bottom: 6px;
}
.gm-progress-row { display: flex; align-items: baseline; gap: 6px; }
.gm-progress-num {
  font-size: 42px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.045em; color: var(--text-primary); line-height: 1;
}
.gm-progress-label {
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.10em; text-transform: uppercase;
  color: var(--text-tertiary); margin-left: 4px;
}
.gm-streak {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 12px; border-radius: 999px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  color: var(--text-tertiary);
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.10em; text-transform: uppercase;
}
.gm-streak.good { color: var(--success); border-color: rgba(107,227,164,0.3); }
.gm-streak.bad  { color: var(--danger);  border-color: rgba(255,107,107,0.3); }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
}
.stat {
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; padding: 14px;
}
.stat-num {
  font-size: 26px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em; color: var(--text-primary); line-height: 1;
}
.stat-num.good { color: var(--success); }
.stat-num.bad  { color: var(--danger); }
.stat-label {
  margin-top: 6px;
  font-size: 10.5px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-tertiary);
}

.progress-track {
  height: 10px; border-radius: 999px;
  background: rgba(255,255,255,0.06);
  overflow: hidden; margin-top: 14px;
}
.progress-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, #60A5FA, #6BE3A4);
  transition: width 0.4s ease;
}
.progress-caption {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--text-tertiary); margin-top: 8px;
}

.empty-state {
  text-align: center; font-size: 12px; font-style: italic;
  color: var(--text-tertiary); padding: 24px 0;
}

@media (max-width: 480px) {
  body { padding: max(20px, env(safe-area-inset-top)) 14px 50px; }
  .gm-card { padding: 16px; }
  .gm-progress-num { font-size: 36px; }
}
</style>
</head>
<body>
<div class="page">

  <h1 class="dash-title">Business</h1>
  <p class="dash-sub" id="refreshedAt">Loading…</p>

  <div id="content">
    <div class="empty-state">Loading business data…</div>
  </div>

</div><!-- /.page -->

<script>
(function () {
  'use strict';

  function fmtMoney(v) {
    if (v == null || v === '') return '—';
    const n = typeof v === 'number' ? v : parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
    if (isNaN(n)) return String(v);
    return '$' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtPct(v) {
    if (v == null || v === '') return '—';
    return String(v).indexOf('%') !== -1 ? String(v) : (v + '%');
  }
  function isNegative(v) {
    return String(v).trim().indexOf('-') === 0;
  }
  function num(v, fallback) {
    const n = parseFloat(v);
    return isNaN(n) ? (fallback || 0) : n;
  }

  function fmtDate(d) {
    if (!d) return '';
    return new Date(d).toLocaleDateString([], { month: 'short', day: 'numeric' });
  }
  function timeAgo(ts) {
    if (!ts) return '';
    const days = Math.floor((Date.now() - ts) / 86400000);
    if (days <= 0) return 'today';
    if (days === 1) return 'yesterday';
    if (days < 7) return days + 'd ago';
    return Math.floor(days / 7) + 'w ago';
  }

  function render(row) {
    const contentEl = document.getElementById('content');
    const refreshedEl = document.getElementById('refreshedAt');

    if (!row || (!row.clients && !row.bank)) {
      contentEl.innerHTML = '<div class="empty-state">No business data yet — ask Claude to pull it from your bank and Stripe.</div>';
      refreshedEl.textContent = '';
      return;
    }

    refreshedEl.textContent = row.clients_refreshed_at
      ? 'Client data checked ' + new Date(row.clients_refreshed_at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
      : '';

    contentEl.innerHTML =
      renderOverviewSection(row.clients) +
      renderSoldSection(row.clients, row.sales) +
      renderRiskSection(row.clients, row.churn) +
      renderBankSection(row.bank, row.bank_refreshed_at);
  }

  function renderOverviewSection(c) {
    if (!c) return '';
    const sr = c.stripeReported || {};
    const anzMrr = c.anzMonthlyRevenue || 0;
    const totalMrr = (sr.mrr || 0) + anzMrr;
    const totalClients = (sr.activeCount || 0) + (c.anzActiveCount || 0);

    return (
      '<div class="section">' +
        '<div class="section-title">Overview</div>' +
        '<div class="gm-card">' +
          '<div class="gm-header">' +
            '<div class="gm-header-left">' +
              '<div class="gm-eyebrow">Total Monthly Recurring Revenue</div>' +
              '<div class="gm-progress-row"><span class="gm-progress-num good">' + fmtMoney(totalMrr) + '</span></div>' +
            '</div>' +
            '<span class="gm-streak">' + totalClients + ' active clients</span>' +
          '</div>' +
          '<div class="stat-grid">' +
            '<div class="stat"><div class="stat-num good">' + fmtMoney(sr.mrr) + '</div><div class="stat-label">Stripe MRR' + (sr.note ? ' *' : '') + '</div></div>' +
            '<div class="stat"><div class="stat-num">' + (sr.activeCount != null ? sr.activeCount : '—') + '</div><div class="stat-label">Stripe Clients' + (sr.note ? ' *' : '') + '</div></div>' +
            '<div class="stat"><div class="stat-num good">' + fmtMoney(anzMrr) + '</div><div class="stat-label">ANZ MRR (verified)</div></div>' +
            '<div class="stat"><div class="stat-num">' + (c.anzActiveCount != null ? c.anzActiveCount : '—') + '</div><div class="stat-label">ANZ Clients (verified)</div></div>' +
          '</div>' +
          (sr.note ? '<div class="progress-caption" style="margin-top:12px;">* ' + sr.note + '</div>' : '') +
        '</div>' +
      '</div>'
    );
  }

  function renderSoldSection(c, sales) {
    const auto = (c && c.newThisWeek) || [];
    const manual = sales || [];
    const merged = auto.map(function (a) {
      return { name: a.name, amount: a.amount, channel: a.channel, ts: new Date(a.firstSeen).getTime(), source: 'bank' };
    }).concat(manual.map(function (s) {
      return { name: s.name, amount: s.mrr, channel: s.channel, ts: s.ts, note: s.note, source: 'logged' };
    }));
    merged.sort(function (a, b) { return b.ts - a.ts; });

    let rows = '';
    if (merged.length === 0) {
      rows = '<div class="empty-state">Nothing new detected this week yet. Tell me when you close a deal and I\'ll add it here.</div>';
    } else {
      merged.forEach(function (m) {
        rows +=
          '<div class="gm-row">' +
            '<span class="gm-row-emoji" style="font-size:18px;margin-right:2px;">🎉</span>' +
            '<div class="gm-row-body"><div class="gm-row-name">' + m.name + '</div>' +
            '<div class="gm-row-meta">' + (m.channel || '') + (m.amount ? ' &middot; $' + m.amount + '/mo' : '') + ' &middot; ' + timeAgo(m.ts) + (m.note ? ' &middot; ' + m.note : '') + '</div></div>' +
          '</div>';
      });
    }

    return (
      '<div class="section">' +
        '<div class="section-title">Sold This Week</div>' +
        '<div class="gm-card">' + rows + '</div>' +
      '</div>'
    );
  }

  function renderRiskSection(c, churn) {
    const stale = (c && c.anzStaleList) || [];
    const manual = churn || [];

    let rows = '';
    stale.forEach(function (s) {
      rows +=
        '<div class="gm-row">' +
          '<div class="gm-row-body"><div class="gm-row-name">' + s.name + '</div>' +
          '<div class="gm-row-meta">was ~$' + s.avgAmount + '/mo via ANZ &middot; last paid ' + fmtDate(s.lastSeen) + ' (' + s.daysSinceLast + 'd ago)</div></div>' +
          '<span class="gm-streak bad" style="flex-shrink:0;">stopped paying</span>' +
        '</div>';
    });
    manual.forEach(function (m) {
      rows +=
        '<div class="gm-row">' +
          '<div class="gm-row-body"><div class="gm-row-name">' + m.name + '</div>' +
          '<div class="gm-row-meta">' + (m.channel || '') + (m.mrr ? ' &middot; $' + m.mrr + '/mo' : '') + ' &middot; ' + timeAgo(m.ts) + (m.note ? ' &middot; ' + m.note : '') + '</div></div>' +
          '<span class="gm-streak bad" style="flex-shrink:0;">churned</span>' +
        '</div>';
    });
    if (!rows) rows = '<div class="empty-state">Nothing flagged — everyone tracked via ANZ has paid recently.</div>';

    return (
      '<div class="section">' +
        '<div class="section-title">At Risk / Churn Watch</div>' +
        '<div class="gm-card">' + rows + '</div>' +
      '</div>'
    );
  }

  function renderBankSection(bank, refreshedAt) {
    if (!bank || !bank.totals) return '';
    const t = bank.totals;
    const asOf = refreshedAt ? new Date(refreshedAt).toLocaleDateString([], { month: 'short', day: 'numeric' }) : '';

    let monthRows = '';
    const months = Object.keys(bank.monthly || {}).sort().reverse();
    months.forEach(function (m) {
      const d = bank.monthly[m];
      const net = d.stripeIn + d.otherIn - d.out;
      const label = new Date(m + '-01').toLocaleDateString([], { month: 'short', year: 'numeric' });
      monthRows +=
        '<div class="gm-row">' +
          '<div class="gm-row-body"><div class="gm-row-name">' + label + '</div>' +
          '<div class="gm-row-meta">In ' + fmtMoney(d.stripeIn + d.otherIn) + ' &middot; Out ' + fmtMoney(d.out) + '</div></div>' +
          '<div class="stat-num ' + (net >= 0 ? 'good' : 'bad') + '" style="font-size:16px;">' + (net >= 0 ? '+' : '') + fmtMoney(net) + '</div>' +
        '</div>';
    });

    return (
      '<div class="section">' +
        '<div class="section-title">Cash Flow &mdash; Last 6 Months' + (asOf ? ' (bank data as of ' + asOf + ')' : '') + '</div>' +
        '<div class="gm-card">' +
          '<div class="gm-header">' +
            '<div class="gm-header-left">' +
              '<div class="gm-eyebrow">Net</div>' +
              '<div class="gm-progress-row"><span class="gm-progress-num ' + (t.net >= 0 ? 'good' : 'bad') + '">' + (t.net >= 0 ? '+' : '') + fmtMoney(t.net) + '</span></div>' +
            '</div>' +
            '<span class="gm-streak">' + fmtMoney(t.totalIn) + ' in &middot; ' + fmtMoney(t.totalOut) + ' out</span>' +
          '</div>' +
          '<div class="stat-grid">' +
            '<div class="stat"><div class="stat-num good">' + fmtMoney(t.stripeRevenue) + '</div><div class="stat-label">Stripe Revenue</div></div>' +
            '<div class="stat"><div class="stat-num good">' + fmtMoney(t.otherIncome) + '</div><div class="stat-label">Bank-Transfer Income</div></div>' +
            '<div class="stat"><div class="stat-num bad">' + fmtMoney(t.salaryOut) + '</div><div class="stat-label">Salary</div></div>' +
            '<div class="stat"><div class="stat-num bad">' + fmtMoney(t.irdOut) + '</div><div class="stat-label">Tax (IRD)</div></div>' +
            '<div class="stat"><div class="stat-num bad">' + fmtMoney(t.rentOut) + '</div><div class="stat-label">Rent</div></div>' +
            '<div class="stat"><div class="stat-num bad">' + fmtMoney(t.softwareOut) + '</div><div class="stat-label">Software</div></div>' +
          '</div>' +
        '</div>' +
        '<div class="gm-card">' +
          '<div class="gm-eyebrow" style="margin-bottom:10px;">By Month</div>' +
          monthRows +
        '</div>' +
      '</div>'
    );
  }

  const SUPABASE_URL = (typeof window !== 'undefined' && window.DASH_SUPABASE_URL) || '';
  const SUPABASE_KEY = (typeof window !== 'undefined' && window.DASH_SUPABASE_KEY) || '';

  function fetchRow() {
    if (!SUPABASE_URL || !SUPABASE_KEY) return;
    fetch(SUPABASE_URL + '/rest/v1/app_state?key=eq.business&select=data', {
      headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
    })
      .then(function (r) { return r.json(); })
      .then(function (rows) { render(rows && rows[0] ? rows[0].data : null); })
      .catch(function () { render(null); });
  }

  // Wait for /api/config (loaded synchronously above) to have set window.DASH_* —
  // it's a blocking <script> tag so by the time this runs it's already resolved.
  fetchRow();

  // Live refresh: if Claude updates the business row while this tab is open.
  if (window.supabase && SUPABASE_URL && SUPABASE_KEY) {
    try {
      const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      supa.channel('app_state_business')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state', filter: 'key=eq.business' }, function (payload) {
          if (payload.new && payload.new.data) render(payload.new.data);
        })
        .subscribe();
    } catch (e) {}
  }
})();
</script>

</body>
</html>
