<!DOCTYPE html>
<html lang="en">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Business · Dashboard</title>

<script src="/api/config"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="sync.js"></script>
<script src="topbar.js" defer></script>

<style>
:root {
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --success: #6BE3A4;
  --warning: #F2C063;
  --danger:  #FF6B6B;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #050506;
  color: var(--text-secondary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(88, 166, 224, 0.16), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(180, 180, 200, 0.06), transparent 50%);
  filter: blur(40px);
  pointer-events: none;
  z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none;
  z-index: -1;
}
@keyframes drift {
  0%   { transform: translate3d(0,0,0); }
  100% { transform: translate3d(-22px, 14px, 0); }
}

.page { max-width: 1100px; margin: 0 auto; }

.dash-title {
  margin: 0 0 4px;
  font-size: 28px; font-weight: 700;
  letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.dash-sub {
  font-size: 12px; color: var(--text-tertiary); margin: 0 0 14px;
}
@media (max-width: 480px) { .dash-title { font-size: 22px; } }

.section { margin-top: 8px; }
.section-title {
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary);
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px;
}
.section-title::before {
  content: ''; width: 18px; height: 1px;
  background: var(--text-tertiary); opacity: 0.6;
}
.section-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(255,255,255,0.08), transparent);
}

.gm-card {
  position: relative;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 14px;
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  overflow: hidden;
}

.gm-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  flex-wrap: wrap; gap: 12px; margin-bottom: 14px;
}
.gm-header-left { display: flex; flex-direction: column; }
.gm-eyebrow {
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary); margin-bottom: 6px;
}
.gm-progress-row { display: flex; align-items: baseline; gap: 6px; }
.gm-progress-num {
  font-size: 42px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.045em; color: var(--text-primary); line-height: 1;
}
.gm-progress-label {
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.10em; text-transform: uppercase;
  color: var(--text-tertiary); margin-left: 4px;
}
.gm-streak {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 12px; border-radius: 999px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  color: var(--text-tertiary);
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.10em; text-transform: uppercase;
}
.gm-streak.good { color: var(--success); border-color: rgba(107,227,164,0.3); }
.gm-streak.bad  { color: var(--danger);  border-color: rgba(255,107,107,0.3); }
.gm-streak.warn { color: var(--warning); border-color: rgba(242,192,99,0.3); }

.gm-row {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px; padding: 12px 0;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.gm-row:first-child { border-top: none; padding-top: 0; }
.gm-row-body { min-width: 0; }
.gm-row-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.gm-row-meta { font-size: 11.5px; color: var(--text-tertiary); margin-top: 3px; line-height: 1.5; }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
}
.stat {
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; padding: 14px;
}
.stat-num {
  font-size: 26px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em; color: var(--text-primary); line-height: 1;
}
.stat-num.good { color: var(--success); }
.stat-num.bad  { color: var(--danger); }
.stat-label {
  margin-top: 6px;
  font-size: 10.5px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-tertiary);
}

.progress-track {
  height: 10px; border-radius: 999px;
  background: rgba(255,255,255,0.06);
  overflow: hidden; margin-top: 14px;
}
.progress-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, #60A5FA, #6BE3A4);
  transition: width 0.4s ease;
}
.progress-caption {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--text-tertiary); margin-top: 8px;
}

.empty-state {
  text-align: center; font-size: 12px; font-style: italic;
  color: var(--text-tertiary); padding: 24px 0;
}

.ql-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.ql-stepper { display: flex; align-items: center; gap: 14px; }
.ql-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05); color: var(--text-primary);
  font-size: 20px; font-weight: 700; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, transform 0.1s;
}
.ql-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.1); }
.ql-num { font-size: 42px; font-weight: 700; color: var(--text-primary); min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
.ql-num.hit { color: var(--success); }
.ql-goal-label { font-size: 11px; color: var(--text-tertiary); letter-spacing: 0.08em; text-transform: uppercase; }
.ql-week { display: flex; gap: 6px; margin-top: 16px; }
.ql-day {
  flex: 1; height: 34px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10.5px; font-weight: 700; color: var(--text-tertiary);
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
}
.ql-day.hit { background: rgba(107,227,164,0.14); border-color: rgba(107,227,164,0.35); color: var(--success); }
.ql-day.partial { background: rgba(242,192,99,0.10); border-color: rgba(242,192,99,0.3); color: var(--warning); }
.ql-day.today { box-shadow: 0 0 0 1.5px rgba(255,255,255,0.5) inset; }

.ql-num.pop { animation: ql-pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes ql-pop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.35); }
  100% { transform: scale(1); }
}
.ql-confetti-wrap {
  position: absolute; inset: 0; overflow: visible; pointer-events: none; z-index: 5;
}
.ql-confetti-piece {
  position: absolute; top: 50%; left: 50%; width: 7px; height: 7px; border-radius: 2px;
  opacity: 1; animation: ql-confetti-fly 0.9s ease-out forwards;
}
@keyframes ql-confetti-fly {
  0%   { transform: translate(-50%, -50%) rotate(0deg) scale(1); opacity: 1; }
  100% { transform: translate(var(--qx), var(--qy)) rotate(var(--qr)) scale(0.4); opacity: 0; }
}
.ql-goal-toast {
  position: absolute; left: 50%; top: -14px; transform: translate(-50%, -100%);
  background: linear-gradient(180deg, #FFF, #E8E5DD); color: #0A0A0B;
  font-size: 12.5px; font-weight: 700; padding: 8px 16px; border-radius: 999px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5); white-space: nowrap;
  opacity: 0; animation: ql-toast 2.2s ease-out forwards; z-index: 6;
}
@keyframes ql-toast {
  0%   { opacity: 0; transform: translate(-50%, -80%) scale(0.85); }
  15%  { opacity: 1; transform: translate(-50%, -110%) scale(1); }
  80%  { opacity: 1; transform: translate(-50%, -110%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -130%) scale(0.95); }
}

@media (max-width: 480px) {
  body { padding: max(20px, env(safe-area-inset-top)) 14px 50px; }
  .gm-card { padding: 16px; }
  .gm-progress-num { font-size: 36px; }
}
</style>
</head>
<body>
<div class="page">

  <h1 class="dash-title">Business</h1>
  <p class="dash-sub" id="refreshedAt">Loading…</p>

  <div class="section">
    <div class="section-title">Qualified Leads Today</div>
    <div class="gm-card" style="overflow:visible;">
      <div class="ql-row">
        <div class="ql-stepper" style="position:relative;">
          <button class="ql-btn" id="qlMinus">&minus;</button>
          <div class="ql-num" id="qlNum">0</div>
          <button class="ql-btn" id="qlPlus">&plus;</button>
          <div class="ql-confetti-wrap" id="qlConfetti"></div>
          <div id="qlToastSlot"></div>
        </div>
        <div>
          <div class="ql-goal-label">Goal: 3 QLs / day</div>
          <span class="gm-streak" id="qlStreakBadge" style="margin-top:6px;">no streak yet</span>
        </div>
      </div>
      <div class="ql-week" id="qlWeek"></div>
    </div>
  </div>

  <div id="content">
    <div class="empty-state">Loading business data…</div>
  </div>

</div><!-- /.page -->

<script>
(function () {
  'use strict';

  function fmtMoney(v) {
    if (v == null || v === '') return '—';
    const n = typeof v === 'number' ? v : parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
    if (isNaN(n)) return String(v);
    return '$' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtPct(v) {
    if (v == null || v === '') return '—';
    return String(v).indexOf('%') !== -1 ? String(v) : (v + '%');
  }
  function isNegative(v) {
    return String(v).trim().indexOf('-') === 0;
  }
  function num(v, fallback) {
    const n = parseFloat(v);
    return isNaN(n) ? (fallback || 0) : n;
  }

  function fmtDate(d) {
    if (!d) return '';
    return new Date(d).toLocaleDateString([], { month: 'short', day: 'numeric' });
  }
  function timeAgo(ts) {
    if (!ts) return '';
    const days = Math.floor((Date.now() - ts) / 86400000);
    if (days <= 0) return 'today';
    if (days === 1) return 'yesterday';
    if (days < 7) return days + 'd ago';
    return Math.floor(days / 7) + 'w ago';
  }

  function render(row) {
    const contentEl = document.getElementById('content');
    const refreshedEl = document.getElementById('refreshedAt');

    if (!row || (!row.clients && !row.bank)) {
      contentEl.innerHTML = '<div class="empty-state">No business data yet — ask Claude to pull it from your bank and Stripe.</div>';
      refreshedEl.textContent = '';
      return;
    }

    refreshedEl.textContent = row.clients_refreshed_at
      ? 'Client data checked ' + new Date(row.clients_refreshed_at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
      : '';

    contentEl.innerHTML =
      renderOverviewSection(row.clients) +
      renderCurrentSection(row.current) +
      renderStaleSection(row.stale_tasks) +
      renderSoldSection(row.clients, row.sales) +
      renderRiskSection(row.clients, row.churn) +
      renderBankSection(row.bank, row.bank_refreshed_at);
  }

  function overdueLabel(dueDate) {
    const days = Math.floor((Date.now() - new Date(dueDate + 'T00:00:00Z').getTime()) / 86400000);
    if (days < 30) return days + 'd overdue';
    if (days < 60) return '1mo overdue';
    return Math.floor(days / 30) + 'mo overdue';
  }

  function renderStaleSection(tasks) {
    const items = tasks || [];
    if (!items.length) return '';
    const sorted = items.slice().sort(function (a, b) { return a.dueDate.localeCompare(b.dueDate); });

    let rows = '';
    sorted.forEach(function (t) {
      rows +=
        '<div class="gm-row">' +
          '<div class="gm-row-body"><div class="gm-row-name">' + t.name + '</div>' +
          '<div class="gm-row-meta">&ldquo;' + t.title + '&rdquo;' + (t.assignee ? ' &middot; ' + t.assignee : '') + '</div></div>' +
          '<span class="gm-streak bad" style="flex-shrink:0;">' + overdueLabel(t.dueDate) + '</span>' +
        '</div>';
    });

    return (
      '<div class="section">' +
        '<div class="section-title">Stale CRM Follow-ups (' + items.length + ')</div>' +
        '<div class="gm-card" style="max-height:360px;overflow-y:auto;">' + rows + '</div>' +
        '<div class="progress-caption" style="margin-top:-6px;margin-bottom:14px;">Snapshot from HighLevel &mdash; ask me to re-check the CRM to refresh this list.</div>' +
      '</div>'
    );
  }

  const TYPE_META = {
    todo:    { pill: 'To Do',    cls: 'warn' },
    waiting: { pill: 'Waiting',  cls: 'warn' },
    watch:   { pill: 'Watch',    cls: 'good' },
    lost:    { pill: 'Lost',     cls: 'bad'  }
  };

  function renderCurrentSection(current) {
    const items = current || [];
    if (!items.length) return '';
    const sorted = items.slice().sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });

    let rows = '';
    sorted.forEach(function (it) {
      const meta = TYPE_META[it.type] || { pill: it.type || '', cls: '' };
      rows +=
        '<div class="gm-row">' +
          '<div class="gm-row-body"><div class="gm-row-name">' + it.name + '</div>' +
          '<div class="gm-row-meta">' + it.note + (it.ts ? ' &middot; ' + timeAgo(it.ts) : '') + '</div></div>' +
          '<span class="gm-streak ' + meta.cls + '" style="flex-shrink:0;">' + meta.pill + '</span>' +
        '</div>';
    });

    return (
      '<div class="section">' +
        '<div class="section-title">Current Things</div>' +
        '<div class="gm-card">' + rows + '</div>' +
      '</div>'
    );
  }

  function renderOverviewSection(c) {
    if (!c) return '';
    const sr = c.stripeReported || {};
    const anzMrr = c.anzMonthlyRevenue || 0;
    const totalMrr = (sr.mrr || 0) + anzMrr;
    const totalClients = (sr.activeCount || 0) + (c.anzActiveCount || 0);

    return (
      '<div class="section">' +
        '<div class="section-title">Overview</div>' +
        '<div class="gm-card">' +
          '<div class="gm-header">' +
            '<div class="gm-header-left">' +
              '<div class="gm-eyebrow">Total Monthly Recurring Revenue</div>' +
              '<div class="gm-progress-row"><span class="gm-progress-num good">' + fmtMoney(totalMrr) + '</span></div>' +
            '</div>' +
            '<span class="gm-streak">' + totalClients + ' active clients</span>' +
          '</div>' +
          '<div class="stat-grid">' +
            '<div class="stat"><div class="stat-num good">' + fmtMoney(sr.mrr) + '</div><div class="stat-label">Stripe MRR' + (sr.note ? ' *' : '') + '</div></div>' +
            '<div class="stat"><div class="stat-num">' + (sr.activeCount != null ? sr.activeCount : '—') + '</div><div class="stat-label">Stripe Clients' + (sr.note ? ' *' : '') + '</div></div>' +
            '<div class="stat"><div class="stat-num good">' + fmtMoney(anzMrr) + '</div><div class="stat-label">ANZ MRR (verified)</div></div>' +
            '<div class="stat"><div class="stat-num">' + (c.anzActiveCount != null ? c.anzActiveCount : '—') + '</div><div class="stat-label">ANZ Clients (verified)</div></div>' +
          '</div>' +
          (sr.note ? '<div class="progress-caption" style="margin-top:12px;">* ' + sr.note + '</div>' : '') +
        '</div>' +
      '</div>'
    );
  }

  function renderSoldSection(c, sales) {
    const auto = (c && c.newThisWeek) || [];
    const manual = sales || [];
    const merged = auto.map(function (a) {
      return { name: a.name, amount: a.amount, channel: a.channel, ts: new Date(a.firstSeen).getTime(), source: 'bank' };
    }).concat(manual.map(function (s) {
      return { name: s.name, amount: s.mrr, channel: s.channel, ts: s.ts, note: s.note, source: 'logged' };
    }));
    merged.sort(function (a, b) { return b.ts - a.ts; });

    let rows = '';
    if (merged.length === 0) {
      rows = '<div class="empty-state">Nothing new detected this week yet. Tell me when you close a deal and I\'ll add it here.</div>';
    } else {
      merged.forEach(function (m) {
        rows +=
          '<div class="gm-row">' +
            '<span class="gm-row-emoji" style="font-size:18px;margin-right:2px;">🎉</span>' +
            '<div class="gm-row-body"><div class="gm-row-name">' + m.name + '</div>' +
            '<div class="gm-row-meta">' + (m.channel || '') + (m.amount ? ' &middot; $' + m.amount + '/mo' : '') + ' &middot; ' + timeAgo(m.ts) + (m.note ? ' &middot; ' + m.note : '') + '</div></div>' +
          '</div>';
      });
    }

    return (
      '<div class="section">' +
        '<div class="section-title">Sold This Week</div>' +
        '<div class="gm-card">' + rows + '</div>' +
      '</div>'
    );
  }

  function renderRiskSection(c, churn) {
    const stale = (c && c.anzStaleList) || [];
    const manual = churn || [];

    let rows = '';
    stale.forEach(function (s) {
      rows +=
        '<div class="gm-row">' +
          '<div class="gm-row-body"><div class="gm-row-name">' + s.name + '</div>' +
          '<div class="gm-row-meta">was ~$' + s.avgAmount + '/mo via ANZ &middot; last paid ' + fmtDate(s.lastSeen) + ' (' + s.daysSinceLast + 'd ago)</div></div>' +
          '<span class="gm-streak bad" style="flex-shrink:0;">stopped paying</span>' +
        '</div>';
    });
    manual.forEach(function (m) {
      rows +=
        '<div class="gm-row">' +
          '<div class="gm-row-body"><div class="gm-row-name">' + m.name + '</div>' +
          '<div class="gm-row-meta">' + (m.channel || '') + (m.mrr ? ' &middot; $' + m.mrr + '/mo' : '') + ' &middot; ' + timeAgo(m.ts) + (m.note ? ' &middot; ' + m.note : '') + '</div></div>' +
          '<span class="gm-streak bad" style="flex-shrink:0;">churned</span>' +
        '</div>';
    });
    if (!rows) rows = '<div class="empty-state">Nothing flagged — everyone tracked via ANZ has paid recently.</div>';

    return (
      '<div class="section">' +
        '<div class="section-title">At Risk / Churn Watch</div>' +
        '<div class="gm-card">' + rows + '</div>' +
      '</div>'
    );
  }

  function renderBankSection(bank, refreshedAt) {
    if (!bank || !bank.totals) return '';
    const t = bank.totals;
    const asOf = refreshedAt ? new Date(refreshedAt).toLocaleDateString([], { month: 'short', day: 'numeric' }) : '';

    let monthRows = '';
    const months = Object.keys(bank.monthly || {}).sort().reverse();
    months.forEach(function (m) {
      const d = bank.monthly[m];
      const net = d.stripeIn + d.otherIn - d.out;
      const label = new Date(m + '-01').toLocaleDateString([], { month: 'short', year: 'numeric' });
      monthRows +=
        '<div class="gm-row">' +
          '<div class="gm-row-body"><div class="gm-row-name">' + label + '</div>' +
          '<div class="gm-row-meta">In ' + fmtMoney(d.stripeIn + d.otherIn) + ' &middot; Out ' + fmtMoney(d.out) + '</div></div>' +
          '<div class="stat-num ' + (net >= 0 ? 'good' : 'bad') + '" style="font-size:16px;">' + (net >= 0 ? '+' : '') + fmtMoney(net) + '</div>' +
        '</div>';
    });

    return (
      '<div class="section">' +
        '<div class="section-title">Cash Flow &mdash; Last 6 Months' + (asOf ? ' (bank data as of ' + asOf + ')' : '') + '</div>' +
        '<div class="gm-card">' +
          '<div class="gm-header">' +
            '<div class="gm-header-left">' +
              '<div class="gm-eyebrow">Net</div>' +
              '<div class="gm-progress-row"><span class="gm-progress-num ' + (t.net >= 0 ? 'good' : 'bad') + '">' + (t.net >= 0 ? '+' : '') + fmtMoney(t.net) + '</span></div>' +
            '</div>' +
            '<span class="gm-streak">' + fmtMoney(t.totalIn) + ' in &middot; ' + fmtMoney(t.totalOut) + ' out</span>' +
          '</div>' +
          '<div class="stat-grid">' +
            '<div class="stat"><div class="stat-num good">' + fmtMoney(t.stripeRevenue) + '</div><div class="stat-label">Stripe Revenue</div></div>' +
            '<div class="stat"><div class="stat-num good">' + fmtMoney(t.otherIncome) + '</div><div class="stat-label">Bank-Transfer Income</div></div>' +
            '<div class="stat"><div class="stat-num bad">' + fmtMoney(t.salaryOut) + '</div><div class="stat-label">Salary</div></div>' +
            '<div class="stat"><div class="stat-num bad">' + fmtMoney(t.irdOut) + '</div><div class="stat-label">Tax (IRD)</div></div>' +
            '<div class="stat"><div class="stat-num bad">' + fmtMoney(t.rentOut) + '</div><div class="stat-label">Rent</div></div>' +
            '<div class="stat"><div class="stat-num bad">' + fmtMoney(t.softwareOut) + '</div><div class="stat-label">Software</div></div>' +
          '</div>' +
        '</div>' +
        '<div class="gm-card">' +
          '<div class="gm-eyebrow" style="margin-bottom:10px;">By Month</div>' +
          monthRows +
        '</div>' +
      '</div>'
    );
  }

  const SUPABASE_URL = (typeof window !== 'undefined' && window.DASH_SUPABASE_URL) || '';
  const SUPABASE_KEY = (typeof window !== 'undefined' && window.DASH_SUPABASE_KEY) || '';

  function fetchRow() {
    if (!SUPABASE_URL || !SUPABASE_KEY) return;
    fetch(SUPABASE_URL + '/rest/v1/app_state?key=eq.business&select=data', {
      headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
    })
      .then(function (r) { return r.json(); })
      .then(function (rows) { render(rows && rows[0] ? rows[0].data : null); })
      .catch(function () { render(null); });
  }

  // Wait for /api/config (loaded synchronously above) to have set window.DASH_* —
  // it's a blocking <script> tag so by the time this runs it's already resolved.
  fetchRow();

  // Live refresh: if Claude updates the business row while this tab is open.
  if (window.supabase && SUPABASE_URL && SUPABASE_KEY) {
    try {
      const supa = (window.dashAuth && window.dashAuth.client)
        ? window.dashAuth.client
        : window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      supa.channel('app_state_business')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state', filter: 'key=eq.business' }, function (payload) {
          if (payload.new && payload.new.data) render(payload.new.data);
        })
        .subscribe();
    } catch (e) {}
  }
})();
</script>

<script>
(function () {
  'use strict';
  var LOG_KEY = 'ql:log';
  var GOAL = 3;
  var MAX_PER_DAY = 20;
  var CONFETTI_COLORS = ['#6BE3A4', '#60A5FA', '#F2C063', '#FF6B6B', '#C9A36B', '#FAFAFA'];

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function loadLog() {
    try { return JSON.parse(localStorage.getItem(LOG_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveLog(log) {
    localStorage.setItem(LOG_KEY, JSON.stringify(log));
  }

  function renderQL() {
    var log = loadLog();
    var tKey = todayKey();
    var todayCount = log[tKey] || 0;

    var numEl = document.getElementById('qlNum');
    numEl.textContent = todayCount;
    numEl.classList.toggle('hit', todayCount >= GOAL);

    // Streak: consecutive days (walking back from today) hitting goal.
    // Today only counts toward the streak once it's hit; otherwise we start counting from yesterday.
    var streak = 0;
    var d = new Date();
    if (todayCount < GOAL) d.setDate(d.getDate() - 1);
    while (true) {
      var k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      if ((log[k] || 0) >= GOAL) { streak++; d.setDate(d.getDate() - 1); } else break;
    }
    var badge = document.getElementById('qlStreakBadge');
    if (streak > 0) {
      badge.textContent = '🔥 ' + streak + ' day' + (streak === 1 ? '' : 's') + ' streak';
      badge.className = 'gm-streak good';
    } else {
      badge.textContent = 'no streak yet';
      badge.className = 'gm-streak';
    }

    // Last 7 days strip (oldest to newest, ending today).
    var weekEl = document.getElementById('qlWeek');
    var html = '';
    for (var i = 6; i >= 0; i--) {
      var dd = new Date();
      dd.setDate(dd.getDate() - i);
      var dk = dd.getFullYear() + '-' + String(dd.getMonth() + 1).padStart(2, '0') + '-' + String(dd.getDate()).padStart(2, '0');
      var count = log[dk] || 0;
      var cls = 'ql-day';
      if (count >= GOAL) cls += ' hit';
      else if (count > 0) cls += ' partial';
      if (dk === tKey) cls += ' today';
      var label = dd.toLocaleDateString([], { weekday: 'narrow' });
      html += '<div class="' + cls + '" title="' + dk + ': ' + count + '">' + label + '</div>';
    }
    weekEl.innerHTML = html;
  }

  function confettiBurst(big) {
    var wrap = document.getElementById('qlConfetti');
    if (!wrap) return;
    var n = big ? 26 : 12;
    for (var i = 0; i < n; i++) {
      var piece = document.createElement('div');
      piece.className = 'ql-confetti-piece';
      var angle = Math.random() * Math.PI * 2;
      var dist = (big ? 70 : 40) + Math.random() * (big ? 60 : 30);
      piece.style.setProperty('--qx', (Math.cos(angle) * dist) + 'px');
      piece.style.setProperty('--qy', (Math.sin(angle) * dist - (big ? 20 : 10)) + 'px');
      piece.style.setProperty('--qr', (Math.random() * 720 - 360) + 'deg');
      piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      piece.style.animationDelay = (Math.random() * 0.08) + 's';
      wrap.appendChild(piece);
      (function (el) { setTimeout(function () { el.remove(); }, 1100); })(piece);
    }
  }

  function celebrate(justHitGoal) {
    var numEl = document.getElementById('qlNum');
    numEl.classList.remove('pop');
    void numEl.offsetWidth; // restart the animation if it's still mid-run
    numEl.classList.add('pop');
    confettiBurst(justHitGoal);
    if (justHitGoal) {
      var slot = document.getElementById('qlToastSlot');
      slot.innerHTML = '<div class="ql-goal-toast">🎉 Goal hit — nice work!</div>';
      setTimeout(function () { slot.innerHTML = ''; }, 2200);
    }
    if (navigator.vibrate) {
      try { navigator.vibrate(justHitGoal ? [30, 40, 30, 40, 60] : 25); } catch (e) {}
    }
  }

  function bump(delta) {
    var log = loadLog();
    var tKey = todayKey();
    var before = log[tKey] || 0;
    var after = Math.min(MAX_PER_DAY, Math.max(0, before + delta));
    log[tKey] = after;
    saveLog(log);
    renderQL();
    if (delta > 0 && after > before) {
      celebrate(before < GOAL && after >= GOAL);
    }
  }

  document.getElementById('qlPlus').addEventListener('click', function () { bump(1); });
  document.getElementById('qlMinus').addEventListener('click', function () { bump(-1); });

  renderQL();

  if (window.initCloudSync) {
    window.initCloudSync({ appKey: 'ql', syncedKeys: [LOG_KEY], onApplied: renderQL });
  }
})();
</script>
